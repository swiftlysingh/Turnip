[package]
name = "documentkit-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
pdf-inspector = { path = "../../Build/vendor/pdf-inspector", version = "=1.24.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"

[profile.release.build-override]
strip = "none"
