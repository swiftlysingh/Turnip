[package]
name = "documentkit-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
pdf-inspector = { path = "../../Build/vendor/pdf-inspector", version = "=1.25.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
# lib.rs catches panics at the C ABI boundary via std::panic::catch_unwind.
panic = "unwind"
# Cargo ignores `strip` for `staticlib` crates (and Rust 1.96's built-in strip
# breaks macOS 27 proc-macro dylibs). Scripts/build-xcframework.sh strips
# __DWARF/__LLVM and localizes internal symbols via xcrun strip and ld -r.
strip = "none"

[profile.release.build-override]
strip = "none"
