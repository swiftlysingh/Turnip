name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  sdk:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged engine
        run: Scripts/verify-artifact.sh
      - name: Test Swift package
        run: swift test --parallel
      - name: Build benchmark runner (release)
        run: swift build -c release --package-path Benchmarks
      - name: Verify committed benchmark fixture
        run: Benchmarks/Scripts/verify-smoke-fixture.sh
      - name: Run diagnostic smoke benchmark (optimized)
        env:
          DOCUMENTKIT_BENCHMARK_SOURCE_REVISION: ${{ github.sha }}
        run: >-
          swift run -c release --package-path Benchmarks documentkit-benchmark
          --manifest Benchmarks/Manifests/smoke-v1.json
          --root Benchmarks
          --output "$RUNNER_TEMP/DocumentKit-Smoke"
          --warmups 1
          --repetitions 2
      - name: Link iOS Simulator executable
        run: |
          DOCUMENTKIT_IOS_SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swift build --package-path Benchmarks \
            --triple arm64-apple-ios16.0-simulator \
            --sdk "$DOCUMENTKIT_IOS_SIMULATOR_SDK"
      - name: Link iOS device executable
        run: |
          DOCUMENTKIT_IOS_DEVICE_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build --package-path Benchmarks \
            --triple arm64-apple-ios16.0 \
            --sdk "$DOCUMENTKIT_IOS_DEVICE_SDK"
      - name: Build sample app for macOS
        run: >-
          xcodebuild
          -project Examples/DocumentKitDemo/DocumentKitDemo.xcodeproj
          -scheme DocumentKitDemo
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DocumentKitDemo-DerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/DocumentKitDemo-Packages"
          CODE_SIGNING_ALLOWED=NO
          -jobs 1
          build
      - name: Build sample app for iPhone Simulator
        run: >-
          xcodebuild
          -project Examples/DocumentKitDemo/DocumentKitDemo.xcodeproj
          -scheme DocumentKitDemo
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DocumentKitDemo-iOS-DerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/DocumentKitDemo-iOS-Packages"
          CODE_SIGNING_ALLOWED=NO
          -jobs 1
          build

  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Prepare pinned engine
        run: Scripts/prepare-engine.sh
      - name: Test bridge
        run: cargo test --locked --manifest-path Native/DocumentKitCore/Cargo.toml
      - name: Lint bridge
        run: cargo clippy --locked --manifest-path Native/DocumentKitCore/Cargo.toml --all-targets -- -D warnings
      - name: Check bridge formatting
        run: cargo fmt --manifest-path Native/DocumentKitCore/Cargo.toml -- --check
