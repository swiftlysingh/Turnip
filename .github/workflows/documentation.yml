name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/documentation.yml
      - Package.swift
      - Sources/Turnip/**
      - Native/DocumentKitCore/include/**
      - Scripts/build-documentation.sh

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check whether Package.swift uses a published release artifact
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^let releaseArtifactURL: String\? = "https://' Package.swift; then
            echo "needs_local_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_local_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Cargo registry
        if: steps.manifest.outputs.needs_local_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: docs-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Native/DocumentKitCore/Cargo.lock') }}
          restore-keys: |
            docs-cargo-${{ runner.os }}-

      - name: Build local XCFramework when Package.swift has no release URL
        if: steps.manifest.outputs.needs_local_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain
          Scripts/build-xcframework.sh
          echo "TURNIP_USE_LOCAL_XCFRAMEWORK=1" >> "$GITHUB_ENV"

      - name: Build DocC archive
        run: Scripts/build-documentation.sh Build/Turnip.doccarchive

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: Build/Turnip.doccarchive

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: false

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
