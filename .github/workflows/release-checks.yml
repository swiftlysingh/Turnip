name: Release guard

on:
  push:
    paths:
      - '.github/workflows/release*.yml'
      - 'Scripts/*release-checks.sh'
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'Scripts/*release-checks.sh'

permissions:
  contents: read

jobs:
  verify-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n Scripts/verify-release-checks.sh Scripts/test-release-checks.sh
      - run: Scripts/test-release-checks.sh
