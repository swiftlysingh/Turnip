name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example, 0.1.0)
        required: true
        type: string

permissions:
  checks: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require passing SDK and Rust checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: Scripts/verify-release-checks.sh
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Run from main with a version such as 0.1.0."
            exit 1
          fi
          gh api "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          gh release create "v$VERSION" --verify-tag \
            --title "Turnip $VERSION" --generate-notes
