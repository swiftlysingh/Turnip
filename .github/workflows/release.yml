name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example, 0.4.0)
        required: true
        type: string

permissions:
  checks: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs and Codemagic checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Run from main with a version such as 0.4.0." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi
          Scripts/verify-release-checks.sh

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Native/DocumentKitCore/Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show active-toolchain

      - name: Build, verify, and archive XCFramework
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archive="Build/DocumentKitCore-$VERSION.xcframework.zip"
          Scripts/build-xcframework.sh --zip "$archive"
          checksum=$(swift package compute-checksum "$archive")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
        id: artifact

      - name: Update Package.swift for release binary target
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          Scripts/set-release-artifact.sh --repository "$GH_REPO" "$VERSION" "$CHECKSUM"
          expected_url="https://github.com/$GH_REPO/releases/download/v$VERSION/DocumentKitCore-$VERSION.xcframework.zip"
          dump=$(swift package dump-package)
          jq -e --arg url "$expected_url" --arg checksum "$CHECKSUM" '
            .targets[]
            | select(.name == "DocumentKitCore")
            | .type == "binary" and .url == $url and .checksum == $checksum
          ' <<< "$dump" >/dev/null
          TURNIP_USE_LOCAL_XCFRAMEWORK=1 swift test --parallel

      - name: Commit manifest, tag, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(git status --porcelain)
          if [ "$status" != " M Package.swift" ]; then
            echo "Expected only Package.swift to be modified, found:" >&2
            echo "$status" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "Release $VERSION"
          git push origin "HEAD:refs/tags/v$VERSION"

          if ! gh release create "v$VERSION" \
            "$ARCHIVE#DocumentKitCore-$VERSION.xcframework.zip" \
            --verify-tag \
            --title "Turnip $VERSION" \
            --generate-notes; then
            git push origin ":refs/tags/v$VERSION" || true
            exit 1
          fi

          if ! git push origin HEAD:refs/heads/main; then
            echo "::warning::Published v$VERSION with DocumentKitCore-$VERSION.xcframework.zip, but could not fast-forward main (branch protection or concurrent push). Sync Package.swift to main in a follow-up PR."
          fi
