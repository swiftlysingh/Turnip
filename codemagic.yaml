workflows:
  sdk:
    name: SDK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.4
    triggering:
      events:
        - push
        - pull_request
        - pull_request_labeled
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    when:
      condition: (not env.CM_TRIGGER_SOURCE == "webhook") or (not event.action == "labeled") or (event.label.name == "codemagic")
    scripts:
      - name: Verify packaged engine
        script: Scripts/verify-artifact.sh
      - name: Test Swift package
        script: swift test --parallel
      - name: Build DocC API documentation
        script: Scripts/build-documentation.sh "$CM_BUILD_DIR/.ci-tmp/Turnip.doccarchive"
      - name: Build benchmark runner (release)
        script: swift build -c release --package-path Benchmarks
      - name: Test benchmark package
        script: swift test --package-path Benchmarks
      - name: Verify committed benchmark fixture
        script: Benchmarks/Scripts/verify-smoke-fixture.sh
      - name: Run diagnostic smoke benchmark (optimized)
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/.ci-tmp/Turnip-Smoke"
          TURNIP_BENCHMARK_SOURCE_REVISION="$CM_COMMIT" \
            swift run -c release --package-path Benchmarks turnip-benchmark \
            --manifest Benchmarks/Manifests/smoke-v1.json \
            --root Benchmarks \
            --output "$CM_BUILD_DIR/.ci-tmp/Turnip-Smoke" \
            --warmups 1 \
            --repetitions 5
      - name: Build sample app for macOS
        script: |
          set -euo pipefail
          xcodebuild \
            -project Examples/TurnipDemo/TurnipDemo.xcodeproj \
            -scheme TurnipDemo \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$CM_BUILD_DIR/.ci-tmp/TurnipDemo-DerivedData" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/.ci-tmp/TurnipDemo-Packages" \
            CODE_SIGNING_ALLOWED=NO \
            -jobs 1 \
            build
      - name: Build sample app for iPhone Simulator
        script: |
          set -euo pipefail
          xcodebuild \
            -project Examples/TurnipDemo/TurnipDemo.xcodeproj \
            -scheme TurnipDemo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/.ci-tmp/TurnipDemo-iOS-DerivedData" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/.ci-tmp/TurnipDemo-iOS-Packages" \
            CODE_SIGNING_ALLOWED=NO \
            -jobs 1 \
            build
    artifacts:
      - .ci-tmp/Turnip.doccarchive/**
      - .ci-tmp/Turnip-Smoke/**

  rust:
    name: Rust
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.4
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $CM_BUILD_DIR/Native/DocumentKitCore/target
    triggering:
      events:
        - push
        - pull_request
        - pull_request_labeled
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    when:
      condition: (not env.CM_TRIGGER_SOURCE == "webhook") or (not event.action == "labeled") or (event.label.name == "codemagic")
    scripts:
      - name: Install Rust 1.96.0
        script: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
            -y --default-toolchain 1.96.0 --profile minimal \
            --component rustfmt --component clippy
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
      - name: Prepare pinned engine
        script: Scripts/prepare-engine.sh
      - name: Check Rust dependency licenses
        script: Scripts/list-rust-licenses.sh
      - name: Test engine provenance reruns
        script: Scripts/test-engine-provenance.sh
      - name: Test bridge
        script: cargo test --locked --manifest-path Native/DocumentKitCore/Cargo.toml
      - name: Lint bridge
        script: cargo clippy --locked --manifest-path Native/DocumentKitCore/Cargo.toml --all-targets -- -D warnings
      - name: Check bridge formatting
        script: cargo fmt --manifest-path Native/DocumentKitCore/Cargo.toml -- --check
